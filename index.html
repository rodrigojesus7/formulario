<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./src/css/reset.css">
    <link rel="stylesheet" href="./src/css/style.css">

</head>

<body>


    <main class="container">

        <section class="mensagens">

            <h1><span>FICOU COM DÚVIDA?</span><span>NOS MANDE UMA MENSAGEM!</span></h1>

            <p>caso tenha ficado com qualquer dúvida basta nos mandar uma mensagem e entraremos em contato em menos de
                24h.</p>

        </section>


            <form class="formulario">
                <input type="text" id="nome" class="input" placeholder="Nome completo *" required>
                <p class="invalido-campo-obrigatorio ocultar">campo obrigatório</p>

                <input type="email" id="email" class="input" placeholder="Email *" required>
                <p class="invalido-campo-obrigatorio ocultar">campo obrigatório</p>

                <input type="tel" id="tel" class="input" placeholder="Telefone *" required>
                <p class="invalido-campo-obrigatorio ocultar">campo obrigatório</p>

                <textarea name="texto" class="input input-mensagem" id="texto" placeholder="Mensagem *" required></textarea>
                <p class="invalido-campo-obrigatorio ocultar">campo obrigatório</p>

                <p class="texto-campo-obrigatorio ocultar">*campos obrigatórios</p>
                <input type="submit" class="botao-enviar">
            </form>





    </main>





    <script src="./src/js/index.js"></script>
</body>

</html>
